; ============================================================
; 服务器联调模拟器配置
; 用法: ./simulator --config config/simulator.ini
; ============================================================

[RabbitMq]
; 本机联调: 127.0.0.1；192.168.8.150实机部署: 改为实际服务器IP（需与终端配置一致）
Host=20.2.100.183
Port=5672
Vhost=/
User=simplatform
Password=simplatform
; Topic交换机名（与终端一致）
Exchange=kdiss.dog

[Control]
; 被控终端ID列表，逗号分隔（多终端: 1,2,3）
TerminalIds=1
; 航点列表（地图坐标米: +x 正东 +y 正南）：x1:y1|x2:y2|...
; 终端 [Map] Enabled=false 时按狗原始局部坐标解释
; 注意: INI 中 ',' 会被 QSettings 解析为字符串列表，'/'/'#' 为注释符，
;       故 x与y 间用 ':' 分隔，航点间用 '|' 分隔
; 默认走一个2m见方方形回到原点
Waypoints=2:0|2:2|0:2|0:0
; 下发航点的默认限速 m/s（<=0用终端默认）
MaxSpeed=0.4
; 到达半径 m
ArriveRadius=0.3
; 单任务超时 ms
TaskTimeoutMs=60000
; 到达后到下发下一航点的间隔 ms
NextWaypointDelayMs=2000
; 地图窗口键盘遥控（点击地图取得焦点后按住生效）：W/S 前后、A/D 左右平移、Q/E 左右旋转
; 线速度 m/s，终端再按 JoyLinearScale 折算成摇杆量
DriveSpeed=0.3
; 旋转角速度 rad/s，终端再按 JoyTurnScale 折算成摇杆量
TurnRate=0.6

[MapUI]
; 地图显示窗口尺寸（米）：x 向右为东、y 向下为南，(0,0) 位于地图正中心
; 默认宽(x)14m x 高(y)23m，即 x∈[-7,7]、y∈[-11.5,11.5]
; 朝向角 0=正东，顺时针为正
WidthM=14
HeightM=23
